<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Padaria 4 Gerações</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="bg-amber-50 min-h-screen flex flex-col">

    <header class="bg-amber-900 text-amber-100 shadow-lg">

        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <div class="flex items-center space-x-3">

                <i class="fa-solid fa-wheat-awn text-3xl text-amber-400"></i>

                <div>

                    <h1 class="text-2xl font-extrabold text-white">
                        4 GERAÇÕES
                    </h1>

                    <p class="text-xs text-amber-300">
                        Tradição & Qualidade em Pães
                    </p>

                </div>

            </div>

            <a href="/"
               class="text-amber-200 hover:text-amber-400 text-xl"
               title="Início">

                <i class="fa-solid fa-house"></i>

            </a>

        </div>

    </header>


    <main class="flex-1 flex items-center justify-center px-6 py-12">

        <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8">


            <!-- Entrar -->

            <div class="bg-amber-100 rounded-[30px] shadow-lg p-8">

                <div class="text-center mb-7">

                    <i class="fa-solid fa-user text-amber-700 text-4xl"></i>

                    <h2 class="text-3xl font-extrabold text-amber-950 mt-4">
                        Entrar
                    </h2>

                    <p class="text-gray-600 mt-2">
                        Acesse sua conta
                    </p>

                </div>


                <div id="erroLogin"
                     class="hidden bg-red-100 text-red-700 rounded-xl p-3 mb-5 text-sm">
                </div>


                <form id="formLogin">

                    <label class="block text-sm font-bold text-amber-950 mb-2">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="emailLogin"
                        required
                        class="w-full border border-amber-200 rounded-xl px-4 py-3 mb-5"
                        placeholder="seuemail@email.com">


                    <label class="block text-sm font-bold text-amber-950 mb-2">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senhaLogin"
                        required
                        class="w-full border border-amber-200 rounded-xl px-4 py-3 mb-6"
                        placeholder="Sua senha">


                    <button
                        type="submit"
                        class="w-full bg-amber-500 hover:bg-amber-600 text-amber-950 font-bold py-3 rounded-xl">

                        Entrar

                    </button>

                </form>

            </div>


            <!-- Criar conta -->

            <div class="bg-white rounded-[30px] shadow-lg border border-amber-100 p-8">

                <div class="text-center mb-7">

                    <i class="fa-solid fa-user-plus text-amber-700 text-4xl"></i>

                    <h2 class="text-3xl font-extrabold text-amber-950 mt-4">
                        Criar conta
                    </h2>

                    <p class="text-gray-600 mt-2">
                        Crie seu próprio acesso
                    </p>

                </div>


                <div id="erroCadastro"
                     class="hidden bg-red-100 text-red-700 rounded-xl p-3 mb-5 text-sm">
                </div>


                <form id="formCadastro">

                    <label class="block text-sm font-bold text-amber-950 mb-2">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="emailCadastro"
                        required
                        class="w-full border border-amber-200 rounded-xl px-4 py-3 mb-5"
                        placeholder="seuemail@email.com">


                    <label class="block text-sm font-bold text-amber-950 mb-2">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senhaCadastro"
                        required
                        minlength="6"
                        class="w-full border border-amber-200 rounded-xl px-4 py-3 mb-5"
                        placeholder="Mínimo de 6 caracteres">


                    <label class="block text-sm font-bold text-amber-950 mb-2">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarCadastro"
                        required
                        minlength="6"
                        class="w-full border border-amber-200 rounded-xl px-4 py-3 mb-6"
                        placeholder="Digite a senha novamente">


                    <button
                        type="submit"
                        class="w-full bg-amber-500 hover:bg-amber-600 text-amber-950 font-bold py-3 rounded-xl">

                        Criar conta

                    </button>

                </form>

            </div>

        </div>

    </main>


    <footer class="bg-amber-950 text-amber-200/70 text-center py-6">

        <p class="text-sm">
            Padaria 4 Gerações &copy; Todos os direitos reservados.
        </p>

    </footer>


    <!-- JavaScript -->

    <script>

        const proximo = new URLSearchParams(window.location.search)
            .get("proximo") || "/produtos";


        function mostrarErro(elemento, mensagem) {

            elemento.textContent = mensagem;

            elemento.classList.remove("hidden");

        }


        document.getElementById("formCadastro").addEventListener("submit", function(evento) {

            evento.preventDefault();

            const email = document
                .getElementById("emailCadastro")
                .value
                .trim()
                .toLowerCase();

            const senha = document
                .getElementById("senhaCadastro")
                .value;

            const confirmar = document
                .getElementById("confirmarCadastro")
                .value;

            const erro = document.getElementById("erroCadastro");

            erro.classList.add("hidden");


            if (senha.length < 6) {

                mostrarErro(
                    erro,
                    "A senha deve ter pelo menos 6 caracteres."
                );

                return;

            }


            if (senha !== confirmar) {

                mostrarErro(
                    erro,
                    "As senhas não são iguais."
                );

                return;

            }


            let usuarios = JSON.parse(
                localStorage.getItem("usuariosPadaria") || "{}"
            );


            if (usuarios[email]) {

                mostrarErro(
                    erro,
                    "Esse e-mail já está cadastrado."
                );

                return;

            }


            usuarios[email] = senha;

            localStorage.setItem(
                "usuariosPadaria",
                JSON.stringify(usuarios)
            );


            localStorage.setItem(
                "usuarioLogado",
                email
            );


            window.location.href = proximo;

        });


        document.getElementById("formLogin").addEventListener("submit", function(evento) {

            evento.preventDefault();

            const email = document
                .getElementById("emailLogin")
                .value
                .trim()
                .toLowerCase();

            const senha = document
                .getElementById("senhaLogin")
                .value;

            const erro = document.getElementById("erroLogin");

            erro.classList.add("hidden");


            const usuarios = JSON.parse(
                localStorage.getItem("usuariosPadaria") || "{}"
            );


            if (!usuarios[email] || usuarios[email] !== senha) {

                mostrarErro(
                    erro,
                    "E-mail ou senha incorretos."
                );

                return;

            }


            localStorage.setItem(
                "usuarioLogado",
                email
            );


            window.location.href = proximo;

        });

    </script>

</body>

</html>
