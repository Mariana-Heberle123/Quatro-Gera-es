<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrador - Padaria 4 Gerações</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-amber-50 min-h-screen flex flex-col text-gray-800">

    <!-- Cabeçalho -->
    <header class="bg-amber-900 text-amber-100 shadow-lg">

        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <div class="flex items-center space-x-3">

                <i class="fa-solid fa-wheat-awn text-3xl text-amber-400"></i>

                <div>
                    <h1 class="text-2xl font-extrabold text-white">
                        4 GERAÇÕES
                    </h1>

                    <p class="text-xs text-amber-300">
                        Área do Administrador
                    </p>
                </div>

            </div>

            <a href="/"
               class="text-amber-200 hover:text-white text-xl"
               title="Início">

                <i class="fa-solid fa-house"></i>

            </a>

        </div>

    </header>


    <!-- Conteúdo -->
    <main class="max-w-6xl mx-auto px-6 py-12 w-full">

        <!-- Login -->
        <div id="areaLogin"
             class="max-w-md mx-auto bg-white rounded-[30px] shadow-lg border border-amber-100 p-8">

            <div class="text-center mb-7">

                <i class="fa-solid fa-user-shield text-amber-700 text-5xl"></i>

                <h2 class="text-3xl font-extrabold text-amber-950 mt-4">
                    Administrador
                </h2>

                <p class="text-gray-600 mt-2">
                    Entre para acessar os pedidos
                </p>

            </div>


            <div id="erroLogin"
                 class="hidden bg-red-100 text-red-700 rounded-xl p-3 mb-5 text-sm">
            </div>


            <form id="formLogin">

                <label class="block text-sm font-bold text-amber-950 mb-2">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    class="w-full border border-amber-200 rounded-xl px-4 py-3 mb-5 outline-none focus:ring-2 focus:ring-amber-500"
                    placeholder="admin@padaria.com">


                <label class="block text-sm font-bold text-amber-950 mb-2">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    required
                    class="w-full border border-amber-200 rounded-xl px-4 py-3 mb-6 outline-none focus:ring-2 focus:ring-amber-500"
                    placeholder="Digite a senha">


                <button
                    type="submit"
                    id="botaoLogin"
                    class="w-full bg-amber-500 hover:bg-amber-600 text-amber-950 font-bold py-3 rounded-xl transition">

                    Entrar

                </button>

            </form>

        </div>


        <!-- Painel do Administrador -->
        <div id="painelAdmin"
             class="hidden">

            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">

                <div>

                    <h2 class="text-4xl font-extrabold text-amber-950">
                        Pedidos
                    </h2>

                    <p class="text-gray-600 mt-2">
                        Consulte e gerencie os pedidos realizados.
                    </p>

                </div>


                <button
                    id="botaoSair"
                    class="bg-amber-950 hover:bg-amber-900 text-white font-bold px-6 py-3 rounded-xl transition">

                    <i class="fa-solid fa-right-from-bracket mr-2"></i>
                    Sair

                </button>

            </div>


            <div id="mensagem"
                 class="hidden rounded-xl p-4 mb-6 text-sm">
            </div>


            <div id="listaPedidos"
                 class="space-y-6">

            </div>


            <div id="semPedidos"
                 class="hidden bg-white rounded-[30px] shadow-lg border border-amber-100 p-10 text-center">

                <i class="fa-solid fa-receipt text-amber-600 text-5xl"></i>

                <h3 class="text-2xl font-extrabold text-amber-950 mt-4">
                    Nenhum pedido encontrado
                </h3>

                <p class="text-gray-600 mt-2">
                    Os pedidos realizados aparecerão aqui.
                </p>

            </div>

        </div>

    </main>


    <!-- Rodapé -->
    <footer class="bg-amber-950 text-amber-200/70 text-center py-6 mt-auto">

        <p class="text-sm">
            Padaria 4 Gerações &copy; Todos os direitos reservados.
        </p>

    </footer>


    <script>

        const areaLogin = document.getElementById("areaLogin");
        const painelAdmin = document.getElementById("painelAdmin");

        const formLogin = document.getElementById("formLogin");
        const erroLogin = document.getElementById("erroLogin");
        const botaoLogin = document.getElementById("botaoLogin");

        const listaPedidos = document.getElementById("listaPedidos");
        const semPedidos = document.getElementById("semPedidos");

        const mensagem = document.getElementById("mensagem");

        const botaoSair = document.getElementById("botaoSair");


        function mostrarMensagem(texto, sucesso = true) {

            mensagem.textContent = texto;

            mensagem.classList.remove(
                "hidden",
                "bg-green-100",
                "text-green-700",
                "bg-red-100",
                "text-red-700"
            );

            if (sucesso) {

                mensagem.classList.add(
                    "bg-green-100",
                    "text-green-700"
                );

            } else {

                mensagem.classList.add(
                    "bg-red-100",
                    "text-red-700"
                );

            }

        }


        async function entrarAdministrador(email, senha) {

            botaoLogin.disabled = true;
            botaoLogin.textContent = "Entrando...";

            erroLogin.classList.add("hidden");

            try {

                const resposta = await fetch(
                    "/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            senha: senha
                        })
                    }
                );


                const resultado = await resposta.json();


                if (!resultado.sucesso) {

                    erroLogin.textContent = resultado.erro;

                    erroLogin.classList.remove("hidden");

                    botaoLogin.disabled = false;
                    botaoLogin.textContent = "Entrar";

                    return;

                }


                areaLogin.classList.add("hidden");

                painelAdmin.classList.remove("hidden");

                carregarPedidos();


            } catch (erro) {

                erroLogin.textContent =
                    "Não foi possível conectar ao servidor.";

                erroLogin.classList.remove("hidden");

                botaoLogin.disabled = false;
                botaoLogin.textContent = "Entrar";

            }

        }


        formLogin.addEventListener(
            "submit",
            function (evento) {

                evento.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const senha =
                    document.getElementById("senha").value;

                entrarAdministrador(
                    email,
                    senha
                );

            }
        );


        async function carregarPedidos() {

            listaPedidos.innerHTML = "";

            semPedidos.classList.add("hidden");

            try {

                const resposta = await fetch(
                    "/admin/pedidos"
                );

                const resultado =
                    await resposta.json();


                if (!resultado.sucesso) {

                    areaLogin.classList.remove("hidden");
                    painelAdmin.classList.add("hidden");

                    erroLogin.textContent = resultado.erro;
                    erroLogin.classList.remove("hidden");

                    return;

                }


                if (resultado.pedidos.length === 0) {

                    semPedidos.classList.remove("hidden");

                    return;

                }


                resultado.pedidos.forEach(
                    function (pedido) {

                        criarPedido(pedido);

                    }
                );


            } catch (erro) {

                mostrarMensagem(
                    "Não foi possível carregar os pedidos.",
                    false
                );

            }

        }


        function criarPedido(pedido) {

            const card =
                document.createElement("div");

            card.className =
                "bg-white rounded-[30px] shadow-lg border border-amber-100 p-6";


            let itensHTML = "";


            pedido.itens.forEach(
                function (item) {

                    const subtotal =
                        item.quantidade * item.preco;


                    itensHTML += `
                        <div class="flex justify-between items-center py-3 border-b border-amber-100">

                            <div>
                                <p class="font-bold text-amber-950">
                                    ${item.nome}
                                </p>

                                <p class="text-sm text-gray-500">
                                    ${item.quantidade} unidade(s)
                                </p>
                            </div>

                            <p class="font-bold text-amber-900">
                                R$ ${subtotal.toFixed(2).replace(".", ",")}
                            </p>

                        </div>
                    `;

                }
            );


            let statusHTML;


            if (pedido.status === "Cancelado") {

                statusHTML = `
                    <span class="inline-flex items-center bg-red-100 text-red-700 px-4 py-2 rounded-full font-bold text-sm">
                        <i class="fa-solid fa-ban mr-2"></i>
                        Cancelado
                    </span>
                `;

            } else {

                statusHTML = `
                    <span class="inline-flex items-center bg-green-100 text-green-700 px-4 py-2 rounded-full font-bold text-sm">
                        <i class="fa-solid fa-circle-check mr-2"></i>
                        Concluído
                    </span>
                `;

            }


            let botaoCancelar = "";


            if (pedido.status !== "Cancelado") {

                botaoCancelar = `
                    <button
                        onclick="cancelarPedido(${pedido.id})"
                        class="w-full md:w-auto bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-3 rounded-xl transition">

                        <i class="fa-solid fa-ban mr-2"></i>
                        Cancelar pedido

                    </button>
                `;

            }


            card.innerHTML = `

                <div class="flex flex-col md:flex-row justify-between gap-4 mb-5">

                    <div>

                        <h3 class="text-2xl font-extrabold text-amber-950">
                            Pedido #${pedido.id}
                        </h3>

                        <p class="text-gray-500 mt-1">
                            ${pedido.data_pedido}
                        </p>

                    </div>

                    <div>
                        ${statusHTML}
                    </div>

                </div>


                <div class="mb-5">

                    ${itensHTML}

                </div>


                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">

                    <div>

                        <p class="text-gray-500">
                            Total do pedido
                        </p>

                        <p class="text-2xl font-extrabold text-amber-900">
                            R$ ${Number(pedido.total).toFixed(2).replace(".", ",")}
                        </p>

                    </div>

                    ${botaoCancelar}

                </div>

            `;


            listaPedidos.appendChild(card);

        }


        async function cancelarPedido(pedidoId) {

            const confirmar =
                window.confirm(
                    "Tem certeza que deseja cancelar o pedido #" +
                    pedidoId +
                    "?"
                );


            if (!confirmar) {
                return;
            }


            try {

                const resposta = await fetch(
                    "/admin/cancelar/" + pedidoId,
                    {
                        method: "POST"
                    }
                );


                const resultado =
                    await resposta.json();


                if (!resultado.sucesso) {

                    mostrarMensagem(
                        resultado.erro,
                        false
                    );

                    return;

                }


                mostrarMensagem(
                    resultado.mensagem,
                    true
                );


                carregarPedidos();


            } catch (erro) {

                mostrarMensagem(
                    "Não foi possível cancelar o pedido.",
                    false
                );

            }

        }


        botaoSair.addEventListener(
            "click",
            async function () {

                await fetch(
                    "/admin/logout"
                );

                painelAdmin.classList.add("hidden");
                areaLogin.classList.remove("hidden");

                formLogin.reset();

            }
        );

    </script>

</body>

</html>
