<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Relatórios - Padaria 4 Gerações</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="bg-amber-50 min-h-screen text-gray-800 flex flex-col">


    <!-- Cabeçalho -->

    <header class="bg-amber-900 text-amber-100 shadow-lg">

        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <div class="flex items-center space-x-3">

                <i class="fa-solid fa-wheat-awn text-3xl text-amber-400"></i>

                <div>

                    <h1 class="text-2xl font-extrabold text-white">
                        4 GERAÇÕES
                    </h1>

                    <p class="text-xs text-amber-300">
                        Tradição & Qualidade em Pães
                    </p>

                </div>

            </div>


            <!-- Menu, Relatórios e Carrinho -->

            <div class="flex items-center gap-8">

                <nav class="hidden md:flex space-x-8 font-semibold">

                    <a href="/"
                       class="text-amber-200 hover:text-white transition">
                        Início
                    </a>

                    <a href="/produtos"
                       class="text-amber-200 hover:text-white transition">
                        Produtos
                    </a>

                </nav>


                <!-- Relatórios -->

                <a href="/relatorios"
                   class="text-amber-400 transition text-2xl"
                   title="Relatórios">

                    <i class="fa-solid fa-chart-column"></i>

                </a>


                <!-- Carrinho -->

                <a href="/carrinho"
                   class="text-amber-200 hover:text-amber-400 transition text-2xl"
                   title="Carrinho">

                    <i class="fa-solid fa-cart-shopping"></i>

                </a>

            </div>

        </div>

    </header>


    <!-- Fase 3 -->

    <main class="max-w-6xl mx-auto px-6 py-12 w-full">


        <!-- Título -->

        <h2 class="text-4xl font-extrabold text-amber-950 text-center">

            Análise de Vendas

        </h2>


        <!-- Recortes de Tempo -->

        <div class="bg-amber-100 rounded-2xl shadow-md p-6 mt-10">

            <h3 class="text-xl font-bold text-amber-950 mb-5">

                Recortes de Tempo

            </h3>


            <div class="flex flex-wrap gap-4">


                <!-- Diário -->

                <a href="/relatorios?periodo=diario"
                   class="px-6 py-3 rounded-xl font-bold
                   {% if periodo == 'diario' %}
                   bg-amber-500 text-amber-950
                   {% else %}
                   bg-white text-gray-700 hover:bg-amber-200
                   {% endif %}">

                    Diário

                </a>


                <!-- Semanal -->

                <a href="/relatorios?periodo=semanal"
                   class="px-6 py-3 rounded-xl font-bold
                   {% if periodo == 'semanal' %}
                   bg-amber-500 text-amber-950
                   {% else %}
                   bg-white text-gray-700 hover:bg-amber-200
                   {% endif %}">

                    Semanal

                </a>


                <!-- Mensal -->

                <a href="/relatorios?periodo=mensal"
                   class="px-6 py-3 rounded-xl font-bold
                   {% if periodo == 'mensal' %}
                   bg-amber-500 text-amber-950
                   {% else %}
                   bg-white text-gray-700 hover:bg-amber-200
                   {% endif %}">

                    Mensal

                </a>

            </div>

        </div>


        <!-- Gráfico -->

        <div class="bg-white rounded-2xl shadow-md border border-amber-100 p-6 mt-8">

            <h3 class="text-2xl font-extrabold text-amber-950 mb-6">

                Data de visualização

            </h3>


            <div class="relative h-[400px]">

                <canvas id="graficoVendas"></canvas>

            </div>

        </div>

    </main>


    <!-- Rodapé -->

    <footer class="bg-amber-950 text-amber-200/70 text-center py-6 mt-auto">

        <p class="text-sm">

            Padaria 4 Gerações &copy; Todos os direitos reservados.

        </p>

    </footer>


    <!-- Dados do gráfico -->

    <script id="dadosVendas" type="application/json">
        {{ {"nomes": nomes, "quantidades": quantidades} | tojson }}
    </script>


    <!-- Gráfico -->

    <script>

        const dados = JSON.parse(
            document.getElementById("dadosVendas").textContent
        );

        const nomes = dados.nomes;

        const quantidades = dados.quantidades;


        const contexto = document
            .getElementById("graficoVendas")
            .getContext("2d");


        new Chart(contexto, {

            type: "bar",

            data: {

                labels: nomes,

                datasets: [

                    {
                        label: "Quantidade vendida",
                        data: quantidades
                    }

                ]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                scales: {

                    y: {

                        beginAtZero: true,

                        ticks: {

                            precision: 0

                        }

                    }

                }

            }

        });

    </script>

</body>

</html>
