<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Relatórios - Padaria 4 Gerações
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body class="bg-amber-50 min-h-screen flex flex-col text-gray-800">


    <!-- CABEÇALHO -->

    <header class="bg-amber-900 text-amber-100 shadow-lg">

        <div class="max-w-7xl mx-auto px-6 py-4
                    flex justify-between items-center">

            <div class="flex items-center space-x-3">

                <i class="fa-solid fa-wheat-awn
                          text-3xl
                          text-amber-400"></i>

                <div>

                    <h1 class="text-2xl
                               font-extrabold
                               text-white">

                        4 GERAÇÕES

                    </h1>

                    <p class="text-xs text-amber-300">

                        Área do Administrador

                    </p>

                </div>

            </div>


            <div class="flex items-center space-x-5">

                <a href="/admin"
                   class="text-amber-200
                          hover:text-amber-400
                          text-xl"
                   title="Administrador">

                    <i class="fa-solid fa-user-shield"></i>

                </a>


                <a href="/"
                   class="text-amber-200
                          hover:text-white
                          text-xl"
                   title="Início">

                    <i class="fa-solid fa-house"></i>

                </a>

            </div>

        </div>

    </header>


    <!-- CONTEÚDO -->

    <main class="max-w-7xl mx-auto px-6 py-12 w-full">


        <div class="mb-8">

            <h2 class="text-4xl
                       font-extrabold
                       text-amber-950">

             Análise de Vendas

            </h2>

            <p class="text-gray-600 mt-2">

                Acompanhe as vendas, os gastos de produção e o lucro.

            </p>

        </div>


        <!-- RECORTES DE TEMPO -->

        <section class="bg-white
                        rounded-[30px]
                        shadow-lg
                        border
                        border-amber-100
                        p-7
                        mb-8">

            <h3 class="text-2xl
                       font-extrabold
                       text-amber-950
                       mb-5">

                Recortes de Tempo

            </h3>


            <div class="flex flex-wrap gap-4">

                <a href="/relatorios?periodo=diario"
                   class="px-6 py-3
                          rounded-xl
                          font-bold
                          {% if periodo == 'diario' %}
                          bg-amber-500 text-amber-950
                          {% else %}
                          bg-amber-100 text-amber-900 hover:bg-amber-200
                          {% endif %}">

                    Diário

                </a>


                <a href="/relatorios?periodo=semanal"
                   class="px-6 py-3
                          rounded-xl
                          font-bold
                          {% if periodo == 'semanal' %}
                          bg-amber-500 text-amber-950
                          {% else %}
                          bg-amber-100 text-amber-900 hover:bg-amber-200
                          {% endif %}">

                    Semanal

                </a>


                <a href="/relatorios?periodo=mensal"
                   class="px-6 py-3
                          rounded-xl
                          font-bold
                          {% if periodo == 'mensal' %}
                          bg-amber-500 text-amber-950
                          {% else %}
                          bg-amber-100 text-amber-900 hover:bg-amber-200
                          {% endif %}">

                    Mensal

                </a>

            </div>

        </section>


        <!-- GRÁFICO -->

        <section class="bg-white
                        rounded-[30px]
                        shadow-lg
                        border
                        border-amber-100
                        p-7">

            <h3 class="text-2xl
                       font-extrabold
                       text-amber-950
                       mb-6">

                Data de visualização

            </h3>


            <div class="relative w-full h-[450px]">

                <canvas id="graficoVendas"></canvas>

            </div>

        </section>

    </main>


    <!-- RODAPÉ -->

    <footer class="bg-amber-950
                   text-amber-200/70
                   text-center
                   py-6
                   mt-auto">

        <p class="text-sm">

            Padaria 4 Gerações
            &copy;
            Todos os direitos reservados.

        </p>

    </footer>


    <!-- DADOS DO FLASK -->

    <script id="dadosGrafico"
            type="application/json">

        {{ {
            "nomes": nomes,
            "vendas": vendas,
            "producao": producao,
            "lucro": lucro
        } | tojson }}

    </script>


    <!-- JAVASCRIPT DO GRÁFICO -->

    <script>

        const dados =
            JSON.parse(
                document
                    .getElementById("dadosGrafico")
                    .textContent
            );


        const nomes =
            dados.nomes;


        const vendas =
            dados.vendas;


        const producao =
            dados.producao;


        const lucro =
            dados.lucro;


        const canvas =
            document.getElementById(
                "graficoVendas"
            );


        const contexto =
            canvas.getContext("2d");


        new Chart(
            contexto,
            {

                type: "bar",


                data: {

                    labels: nomes,


                    datasets: [

                        {
                            label:
                                "Valor de venda",

                            data:
                                vendas
                        },


                        {
                            label:
                                "Gasto de produção",

                            data:
                                producao
                        },


                        {
                            label:
                                "Lucro",

                            data:
                                lucro
                        }

                    ]

                },


                options: {

                    responsive: true,

                    maintainAspectRatio: false,


                    scales: {

                        y: {

                            beginAtZero: true,

                            ticks: {

                                callback:
                                    function(valor) {

                                        return "R$ "
                                            + Number(valor)
                                                .toFixed(2)
                                                .replace(
                                                    ".",
                                                    ","
                                                );

                                    }

                            }

                        }

                    },


                    plugins: {

                        tooltip: {

                            callbacks: {

                                label:
                                    function(contexto) {

                                        return (
                                            contexto.dataset.label
                                            + ": R$ "
                                            + Number(
                                                contexto.raw
                                            )
                                                .toFixed(2)
                                                .replace(
                                                    ".",
                                                    ","
                                                )
                                        );

                                    }

                            }

                        }

                    }

                }

            }
        );

    </script>


</body>

</html>
